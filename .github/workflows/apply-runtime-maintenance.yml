name: Apply runtime maintenance

on:
  push:
    branches: [production/pi-desktop-runtime]
    paths: [.github/workflows/apply-runtime-maintenance.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/tack-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-runtime
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def replace(path, before, after, count=1):
              p=Path(path)
              text=p.read_text()
              assert text.count(before)==count, (path, text.count(before), before[:120])
              p.write_text(text.replace(before,after))
          replace('internal/agent/coordinator_test.go',
              'cfg.Config().Options.SkillsPaths = []string{skillsRoot}\n',
              'cfg.Config().Options.SkillsPaths = []string{skillsRoot}\n\tcfg.Config().SetupAgents()\n')
          replace('internal/fsext/fileutil.go','ToSlash: fastwalk.DefaultToSlash(),','ToSlash: false,')
          replace('internal/fsext/ls.go','ToSlash:  fastwalk.DefaultToSlash(),','ToSlash:  false,')
          replace('internal/fsext/ls.go','rootPath:         rootPath,','rootPath:         filepath.Clean(rootPath),')
          replace('internal/fsext/ls.go',
              'func ListDirectory(initialPath string, ignorePatterns []string, depth, limit int) ([]string, bool, error) {\n',
              'func ListDirectory(initialPath string, ignorePatterns []string, depth, limit int) ([]string, bool, error) {\n\tinitialPath = filepath.Clean(initialPath)\n')
          replace('internal/fsext/fileutil.go','return !strings.HasPrefix(rel, "..")',
              'return rel != ".." && !strings.HasPrefix(rel, ".."+string(filepath.Separator)) && !filepath.IsAbs(rel)')
          p=Path('internal/agent/prompt/system_resources.go')
          p.write_text('''package prompt

          import (
              "errors"
              "fmt"
              "io"
              "os"
              "path/filepath"
              "strings"
          )

          const maxSystemResourceBytes = 256 * 1024

          type systemResources struct {
              System string
              Replace bool
              Append string
          }

          func loadSystemResources(workingDir string) (systemResources, error) {
              global := strings.TrimSpace(os.Getenv("CRUSH_GLOBAL_CONFIG"))
              if global == "" {
                  dir, err := os.UserConfigDir()
                  if err != nil {
                      return systemResources{}, fmt.Errorf("system prompt directory: %w", err)
                  }
                  global = filepath.Join(dir, "crush")
              }
              roots := []string{filepath.Join(workingDir, ".tack"), filepath.Join(workingDir, ".pi")}
              result := systemResources{}
              text, found, err := readFirstSystemResource(roots, "SYSTEM.md")
              if err != nil {
                  return result, err
              }
              if !found {
                  text, found, err = readFirstSystemResource([]string{global}, "SYSTEM.md")
                  if err != nil {
                      return result, err
                  }
              }
              result.System, result.Replace = text, found
              globalAppend, _, err := readFirstSystemResource([]string{global}, "APPEND_SYSTEM.md")
              if err != nil {
                  return result, err
              }
              projectAppend, _, err := readFirstSystemResource(roots, "APPEND_SYSTEM.md")
              if err != nil {
                  return result, err
              }
              var sections []string
              for _, section := range []string{globalAppend, projectAppend} {
                  if section != "" {
                      sections = append(sections, section)
                  }
              }
              result.Append = strings.Join(sections, "\\n\\n")
              return result, nil
          }

          func readFirstSystemResource(roots []string, name string) (string, bool, error) {
              for _, root := range roots {
                  path := filepath.Join(root, name)
                  file, err := os.Open(path)
                  if errors.Is(err, os.ErrNotExist) {
                      continue
                  }
                  if err != nil {
                      return "", false, fmt.Errorf("read system resource %s: %w", path, err)
                  }
                  info, err := file.Stat()
                  if err != nil || !info.Mode().IsRegular() {
                      file.Close()
                      return "", false, fmt.Errorf("system resource %s must be a regular file", path)
                  }
                  data, readErr := io.ReadAll(io.LimitReader(file, maxSystemResourceBytes+1))
                  closeErr := file.Close()
                  if readErr != nil {
                      return "", false, fmt.Errorf("read system resource %s: %w", path, readErr)
                  }
                  if closeErr != nil {
                      return "", false, closeErr
                  }
                  if len(data) > maxSystemResourceBytes {
                      return "", false, fmt.Errorf("system resource %s exceeds %d bytes", path, maxSystemResourceBytes)
                  }
                  return strings.TrimPrefix(string(data), "\\ufeff"), true, nil
              }
              return "", false, nil
          }
          ''')
          replace('internal/agent/prompt/prompt.go',
              'type PromptDat struct {\n',
              'type PromptDat struct {\n\tUserSystem string\n\tReplaceSystem bool\n\tAppendSystem string\n')
          replace('internal/agent/prompt/prompt.go',
              'componentTemplate: contentDigest(p.template),',
              'componentTemplate: contentDigest(p.template + "\\x00" + fmt.Sprint(d.ReplaceSystem) + "\\x00" + d.UserSystem + "\\x00" + d.AppendSystem),')
          replace('internal/agent/prompt/prompt.go',
              '\tdata := PromptDat{\n',
              '\tvar resources systemResources\n\tif p.name == "coder" {\n\t\tvar err error\n\t\tresources, err = loadSystemResources(workingDir)\n\t\tif err != nil {\n\t\t\treturn PromptDat{}, err\n\t\t}\n\t}\n\tdata := PromptDat{\n\t\tUserSystem: resources.System,\n\t\tReplaceSystem: resources.Replace,\n\t\tAppendSystem: resources.Append,\n')
          p=Path('internal/agent/templates/coder.md.tpl')
          template=p.read_text()
          template='{{if .ReplaceSystem}}{{.UserSystem}}{{else}}'+template
          template=template.replace('operating inside Tack,','operating inside Gotack,')
          template=template.replace('In addition to the tools above, you may have access to other custom tools depending on the project.\n\n','')
          template=template.replace('{{end}}{{if .ContextFiles}}','{{end}}{{end}}\n{{if .AppendSystem}}{{.AppendSystem}}\n{{end}}{{if .ContextFiles}}',1)
          p.write_text(template)
          replace('internal/agent/prompt/coder_template_test.go','operating inside Tack,','operating inside Gotack,')
          replace('internal/agent/prompt/coder_template_test.go',
              '\trequire.Contains(t, text, "In addition to the tools above, you may have access to other custom tools depending on the project.")\n',
              '\trequire.NotContains(t, text, "you may have access to other custom tools")\n')
          p=Path('internal/agent/coordinator.go')
          text=p.read_text()
          needle='skillsPromptDirty bool'
          import re
          text,n=re.subn(r'(skillsPromptDirty\s+bool)',r'\1\n\tlastPromptText string',text,count=1)
          assert n==1
          text=text.replace('if !changed && !c.skillsPromptDirty {\n\t\treturn nil\n\t}',
              'if changed {\n\t\tc.skillsPromptDirty = true\n\t}')
          start=text.index('func (c *coordinator) refreshSkills(')
          end=text.index('\n// RefreshPrompt',start)
          segment=text[start:end]
          segment=segment.replace('\tc.skillsPromptDirty = true\n\tc.skillTracker.SetActiveSkills(c.skills.ActiveSkills())',
              '\tif changed {\n\t\tc.skillTracker.SetActiveSkills(c.skills.ActiveSkills())\n\t}')
          segment=segment.replace('\tc.currentAgent.SetPromptBuild(build)\n',
              '\tif c.lastPromptText != build.Text || c.skillsPromptDirty {\n\t\tc.currentAgent.SetPromptBuild(build)\n\t\tc.lastPromptText = build.Text\n\t}\n')
          text=text[:start]+segment+text[end:]
          p.write_text(text)
          p=Path('internal/agent/agent.go')
          text=p.read_text()
          begin=text.index('\tstates := mcp.GetStates()')
          end=text.index('\n\tif len(agentTools)',begin)
          text=text[:begin]+text[end:]
          text=text.replace('\t"github.com/charmbracelet/crush/internal/agent/tools/mcp"\n','')
          assert 'mcp.' not in text
          text=text.replace('prepared.Tools = traceTools(a.tools.Copy(), trace)','prepared.Tools = traceTools(agentTools, trace)')
          p.write_text(text)
          p=Path('internal/agent/prompt/system_resources_test.go')
          p.write_text('''package prompt

          import (
              "os"
              "path/filepath"
              "strings"
              "testing"
          )

          func TestSystemResourcesPrecedenceAndLiteralContent(t *testing.T) {
              global, project := t.TempDir(), t.TempDir()
              t.Setenv("CRUSH_GLOBAL_CONFIG", global)
              put := func(root, name, text string) {
                  t.Helper()
                  if err := os.MkdirAll(root, 0o700); err != nil { t.Fatal(err) }
                  if err := os.WriteFile(filepath.Join(root, name), []byte(text), 0o600); err != nil { t.Fatal(err) }
              }
              put(global, "SYSTEM.md", "global system")
              put(global, "APPEND_SYSTEM.md", "global append")
              put(filepath.Join(project, ".pi"), "SYSTEM.md", "pi fallback")
              put(filepath.Join(project, ".tack"), "SYSTEM.md", "literal {{.Config}}")
              put(filepath.Join(project, ".tack"), "APPEND_SYSTEM.md", "project append")
              p, err := NewPrompt("coder", coderTemplate(t))
              if err != nil { t.Fatal(err) }
              store := newTestStore(t, project)
              first, err := p.BuildPrompt(t.Context(), "test", "model", store)
              if err != nil { t.Fatal(err) }
              if !strings.Contains(first.Text, "literal {{.Config}}") || strings.Contains(first.Text, "global system") || strings.Contains(first.Text, "expert coding assistant") {
                  t.Fatalf("incorrect replacement: %s", first.Text)
              }
              if !strings.Contains(first.Text, "global append\\n\\nproject append") { t.Fatal(first.Text) }
              put(filepath.Join(project, ".tack"), "SYSTEM.md", "changed")
              second, err := p.BuildPrompt(t.Context(), "test", "model", store)
              if err != nil { t.Fatal(err) }
              if !strings.Contains(second.Text, "changed") { t.Fatal("resource edit not reloaded") }
              if len(second.Generation.ChangedStable(first.Generation)) == 0 { t.Fatal("replacement did not invalidate stable generation") }
          }

          func TestSystemResourcesEmptyOverrideAndLimits(t *testing.T) {
              global, project := t.TempDir(), t.TempDir()
              t.Setenv("CRUSH_GLOBAL_CONFIG", global)
              path := filepath.Join(global, "SYSTEM.md")
              if err := os.WriteFile(path, nil, 0o600); err != nil { t.Fatal(err) }
              r, err := loadSystemResources(project)
              if err != nil || !r.Replace || r.System != "" { t.Fatalf("empty override lost: %+v %v", r, err) }
              if err := os.WriteFile(path, []byte(strings.Repeat("x", maxSystemResourceBytes+1)), 0o600); err != nil { t.Fatal(err) }
              if _, err := loadSystemResources(project); err == nil { t.Fatal("oversized resource accepted") }
              if err := os.Remove(path); err != nil { t.Fatal(err) }
              if err := os.Mkdir(path, 0o700); err != nil { t.Fatal(err) }
              if _, err := loadSystemResources(project); err == nil { t.Fatal("directory resource accepted") }
          }
          ''')
          Path('.github/workflows/apply-runtime-maintenance.yml').unlink()
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          changed += ['internal/agent/prompt/system_resources.go','internal/agent/prompt/system_resources_test.go']
          subprocess.run(['gofmt','-w']+[p for p in changed if p.endswith('.go')],check=True)
      - name: Commit reviewed source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add internal/agent internal/fsext .github/workflows/apply-runtime-maintenance.yml
          git commit -m 'fix: system prompt resources, live refresh and Windows file discovery'
          git push origin HEAD:production/pi-desktop-runtime
      - name: Test affected runtime packages
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/agent/... ./internal/fsext/...
