name: Apply engine lifecycle fixes

on:
  push:
    branches: [production/pi-desktop-runtime]
    paths: [.github/workflows/apply-engine-lifecycle.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dyu-36/tack-engine'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production/pi-desktop-runtime
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply checked source edits
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def replace(path, before, after):
              p=Path(path); text=p.read_text()
              assert text.count(before)==1, (path, text.count(before), before[:100])
              p.write_text(text.replace(before,after))
          replace('internal/agent/agent.go', '''	// Generate title from the first real (non-shell) user prompt.
          	// can take tens of seconds. Blocking Run on it delays the
          	// response to the caller. Use a detached context so the title
          	// goroutine survives Run's cancel.
          	if !hasUserTextMessage(msgs) {
          		titleCtx := context.WithoutCancel(ctx)
          		go a.GenerateTitle(titleCtx, call.SessionID, call.Prompt)
          	}''', '''	if !hasUserTextMessage(msgs) {
          		titleCtx, titleCancel := context.WithTimeout(genCtx, 30*time.Second)
          		titleDone := make(chan struct{})
          		go func() {
          			defer close(titleDone)
          			a.GenerateTitle(titleCtx, call.SessionID, call.Prompt)
          		}()
          		defer func() {
          			titleCancel()
          			<-titleDone
          		}()
          	}''')
          replace('internal/agent/agent.go', '''	for _, attempt := range attempts {
          		tok := int64(40)''', '''	for _, attempt := range attempts {
          		if ctx.Err() != nil { return }
          		tok := int64(40)''')
          replace('internal/agent/tools/glob.go', '\t\t\t\tnormalizeFilePaths(files)\n', '')
          replace('internal/agent/tools/glob.go', '\t\tif err == nil {\n\t\t\treturn matches, len(matches) >= limit && limit > 0, nil\n\t\t}',
              '\t\tif err == nil {\n\t\t\tnormalizeFilePaths(matches)\n\t\t\treturn matches, len(matches) >= limit && limit > 0, nil\n\t\t}')
          replace('internal/agent/tools/glob.go', '\treturn fsext.GlobGitignoreAwareCtx(ctx, walkPattern, walkRoot, limit)',
              '\tfiles, truncated, err := fsext.GlobGitignoreAwareCtx(ctx, walkPattern, walkRoot, limit)\n\tnormalizeFilePaths(files)\n\treturn files, truncated, err')
          Path('internal/projects/projects.go').write_text('''package projects

          import (
              "encoding/json"
              "errors"
              "os"
              "path/filepath"
              "slices"
              "sync"
              "time"

              "github.com/charmbracelet/crush/internal/config"
          )

          const projectsFileName = "projects.json"

          type Project struct {
              Path string `json:"path"`
              DataDir string `json:"data_dir"`
              LastAccessed time.Time `json:"last_accessed"`
          }

          type ProjectList struct { Projects []Project `json:"projects"` }

          var mu sync.Mutex

          func projectsFilePath() string {
              return filepath.Join(filepath.Dir(config.GlobalConfigData()), projectsFileName)
          }

          func Load() (*ProjectList, error) {
              mu.Lock()
              defer mu.Unlock()
              return loadLocked()
          }

          func loadLocked() (*ProjectList, error) {
              data, err := os.ReadFile(projectsFilePath())
              if errors.Is(err, os.ErrNotExist) { return &ProjectList{Projects: []Project{}}, nil }
              if err != nil { return nil, err }
              var list ProjectList
              if err := json.Unmarshal(data, &list); err != nil { return nil, err }
              return &list, nil
          }

          func Save(list *ProjectList) error {
              mu.Lock()
              defer mu.Unlock()
              return saveLocked(list)
          }

          func saveLocked(list *ProjectList) error {
              if list == nil { return errors.New("nil project list") }
              path := projectsFilePath()
              if err := os.MkdirAll(filepath.Dir(path), 0o700); err != nil { return err }
              data, err := json.MarshalIndent(list, "", "  ")
              if err != nil { return err }
              file, err := os.CreateTemp(filepath.Dir(path), ".projects-*")
              if err != nil { return err }
              temporary := file.Name()
              defer os.Remove(temporary)
              if _, err = file.Write(data); err == nil { err = file.Sync() }
              closeErr := file.Close()
              if err != nil { return err }
              if closeErr != nil { return closeErr }
              return os.Rename(temporary, path)
          }

          func Register(workingDir, dataDir string) error {
              mu.Lock()
              defer mu.Unlock()
              list, err := loadLocked()
              if err != nil { return err }
              now := time.Now().UTC()
              for _, project := range list.Projects {
                  if !now.After(project.LastAccessed) { now = project.LastAccessed.Add(time.Nanosecond) }
              }
              found := false
              for index, project := range list.Projects {
                  if project.Path == workingDir {
                      list.Projects[index].DataDir = dataDir
                      list.Projects[index].LastAccessed = now
                      found = true
                      break
                  }
              }
              if !found { list.Projects = append(list.Projects, Project{Path:workingDir, DataDir:dataDir, LastAccessed:now}) }
              slices.SortFunc(list.Projects, func(a,b Project) int { return b.LastAccessed.Compare(a.LastAccessed) })
              return saveLocked(list)
          }

          func List() ([]Project, error) {
              list, err := Load()
              if err != nil { return nil, err }
              return list.Projects, nil
          }
          ''')
          Path('internal/projects/concurrency_test.go').write_text('''package projects

          import (
              "fmt"
              "sync"
              "testing"
              "time"
          )

          func TestRegisterDoesNotLoseConcurrentUpdates(t *testing.T) {
              t.Setenv("CRUSH_GLOBAL_DATA", t.TempDir())
              var wg sync.WaitGroup
              for index := range 32 {
                  wg.Add(1)
                  go func() {
                      defer wg.Done()
                      if err := Register(fmt.Sprintf("project-%02d", index), "data"); err != nil { t.Error(err) }
                  }()
              }
              wg.Wait()
              projects, err := List()
              if err != nil { t.Fatal(err) }
              if len(projects) != 32 { t.Fatalf("lost registrations: %d",len(projects)) }
              for index:=1; index<len(projects); index++ {
                  if !projects[index-1].LastAccessed.After(projects[index].LastAccessed) { t.Fatal("access order is not strict") }
              }
          }

          func TestRegistrationRemainsMostRecentWhenClockMovesBackwards(t *testing.T) {
              t.Setenv("CRUSH_GLOBAL_DATA", t.TempDir())
              future := time.Now().UTC().Add(time.Hour)
              if err := Save(&ProjectList{Projects:[]Project{{Path:"old",LastAccessed:future}}}); err!=nil {t.Fatal(err)}
              if err := Register("new","data"); err!=nil {t.Fatal(err)}
              projects, err := List()
              if err!=nil {t.Fatal(err)}
              if len(projects)!=2 || projects[0].Path!="new" || !projects[0].LastAccessed.After(future) {t.Fatalf("incorrect access ordering: %+v",projects)}
          }
          ''')
          Path('internal/agent/title_lifecycle_test.go').write_text('''package agent

          import (
              "context"
              "testing"
              "time"

              "charm.land/fantasy"
          )

          type cancellingTitleModel struct {
              finishStreamModel
              started chan struct{}
              stopped chan struct{}
          }

          func (m *cancellingTitleModel) Stream(ctx context.Context, call fantasy.Call) (fantasy.StreamResponse,error) {
              close(m.started)
              <-ctx.Done()
              close(m.stopped)
              return nil, ctx.Err()
          }

          func TestRunJoinsCancelledTitleBeforeReturning(t *testing.T) {
              env := testEnv(t)
              title := &cancellingTitleModel{started:make(chan struct{}),stopped:make(chan struct{})}
              main := &titleAwaitingMainModel{finishStreamModel:finishStreamModel{text:"done"},started:title.started}
              sa := testSessionAgent(env,main,title,"system")
              session,err := env.sessions.Create(t.Context(),"test")
              if err!=nil {t.Fatal(err)}
              ctx,cancel:=context.WithTimeout(t.Context(),5*time.Second)
              defer cancel()
              if _,err:=sa.Run(ctx,SessionAgentCall{SessionID:session.ID,Prompt:"test"});err!=nil {t.Fatal(err)}
              select {
              case <-title.stopped:
              default: t.Fatal("Run returned while title goroutine was still using session storage")
              }
          }

          type titleAwaitingMainModel struct { finishStreamModel; started <-chan struct{} }

          func (m *titleAwaitingMainModel) Stream(ctx context.Context,call fantasy.Call)(fantasy.StreamResponse,error) {
              select {
              case <-m.started: return m.finishStreamModel.Stream(ctx,call)
              case <-ctx.Done(): return nil,ctx.Err()
              }
          }
          ''')
          Path('.github/workflows/apply-engine-lifecycle.yml').unlink()
          changed=subprocess.check_output(['git','ls-files','-m','-o','--exclude-standard']).decode().splitlines()
          subprocess.run(['gofmt','-w',*[p for p in changed if p.endswith('.go') and Path(p).is_file()]],check=True)
      - name: Commit implementation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gotack maintenance'
          git config user.email 'maintenance@gotack.local'
          git add internal/agent/agent.go internal/agent/tools/glob.go internal/agent/title_lifecycle_test.go internal/projects .github/workflows/apply-engine-lifecycle.yml
          git commit -m 'fix: join title tasks, normalize tool paths and serialize project registration'
          git push origin HEAD:production/pi-desktop-runtime
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test complete engine
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=readonly -count=1 ./...
          go vet -mod=readonly ./...
          go test -race -mod=readonly -count=1 ./internal/agent ./internal/projects ./internal/fsext
