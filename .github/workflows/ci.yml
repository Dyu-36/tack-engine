name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: v0.8.1
  DEADCODE_VERSION: v0.49.0

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, race tests and static analysis
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l (git ls-files '*.go'))
          if ($unformatted.Count -gt 0) {
            Write-Host 'These files need gofmt:'
            $unformatted | ForEach-Object { Write-Host $_ }
            gofmt -d $unformatted
            throw 'gofmt found unformatted files'
          }
      - name: Check go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        shell: bash
        run: go vet -tags gotacktest ./...
      - name: Staticcheck
        shell: bash
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@"$STATICCHECK_VERSION"
          staticcheck -tags gotacktest ./...
      - name: Check unreachable functions
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/deadcode@"$DEADCODE_VERSION"
          # `deadcode .` is the shipped entrypoint graph and must be empty: the
          # product gate runs the same command against the pinned revision.
          # `deadcode ./...` additionally covers packages that only tests import,
          # so no dead code can hide anywhere in the module.
          deadcode . | tee deadcode-shipped.txt
          test ! -s deadcode-shipped.txt
          deadcode ./... | tee deadcode-all.txt
          test ! -s deadcode-all.txt
      - name: Upload deadcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-deadcode-diagnostics
          path: |
            deadcode-shipped.txt
            deadcode-all.txt
          if-no-files-found: warn
      - name: Build with the race detector
        shell: bash
        run: go build -race ./...
      - name: Race tests
        shell: bash
        run: go test -race -tags gotacktest -failfast ./...
