name: Apply prompt runtime changes

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/complete-runtime.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'production/pi-runtime-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Apply reviewed implementation and regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap
          original = subprocess.check_output(['git', 'show', '765eb31f41a2d451ca3e04d29dfd58134049753c:.github/workflows/complete-runtime.yml'], text=True)
          source = textwrap.dedent(original.split("python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          source = source.replace('loadSystemFiles(workingDir, config.GlobalConfig())', 'loadSystemFiles(workingDir, filepath.Dir(config.GlobalConfig()))')
          exec(compile(source, '<reviewed-prompt-implementation>', 'exec'))
          p = Path('internal/agent/prompt/generation_test.go')
          text = p.read_text()
          before = 'require.Empty(t, buildOne.Generation.ChangedDynamic(buildTwo.Generation))'
          assert text.count(before) == 1
          text = text.replace(before, 'require.Equal(t, []string{"date"}, buildOne.Generation.ChangedDynamic(buildTwo.Generation))')
          text = text.replace('// The formatted date is day-granular; same-day builds share every\n\t// digest, a new day rotates only the dynamic date component.', '// Clock changes rotate only the dynamic date component, never the stable prefix.')
          p.write_text(text)
          p = Path('internal/agent/prompt/prompt.go')
          text = p.read_text()
          start = text.index('func loadContextFiles(')
          end = text.index('// canonicalDedupeKey', start)
          text = text[:start] + '''func loadContextFiles(paths []string, store *config.ConfigStore, platform string) []ContextGroup {
              aliases := make(map[string][]string, len(paths))
              for _, path := range paths {
                  expanded := expandPath(path, store)
                  resolved := filepathext.SmartJoin(store.WorkingDir(), expanded)
                  absolute, err := filepath.Abs(filepath.Clean(resolved))
                  if err != nil { absolute = filepath.Clean(resolved) }
                  key := canonicalDedupeKey(absolute, platform)
                  aliases[key] = append(aliases[key], absolute)
              }
              keys := make([]string, 0, len(aliases))
              for key := range aliases { keys = append(keys, key) }
              slices.Sort(keys)
              groups := make([]ContextGroup, 0, len(keys))
              renderedFiles := make(map[string]struct{})
              for _, key := range keys {
                  candidates := aliases[key]
                  slices.Sort(candidates)
                  candidates = slices.Compact(candidates)
                  selected := candidates[0]
                  for _, candidate := range candidates {
                      if _, err := os.Stat(candidate); err == nil { selected = candidate; break }
                  }
                  files := processContextPath(selected, store)
                  unique := files[:0:0]
                  for _, file := range files {
                      file.Path = canonicalRenderPath(file.Path, platform)
                      fileKey := canonicalDedupeKey(file.Path, platform)
                      if _, duplicate := renderedFiles[fileKey]; duplicate { continue }
                      renderedFiles[fileKey] = struct{}{}
                      unique = append(unique, file)
                  }
                  slices.SortFunc(unique, func(a, b ContextFile) int { return strings.Compare(a.Path, b.Path) })
                  groups = append(groups, ContextGroup{Key: key, Files: unique})
              }
              return groups
          }

          ''' + text[end:]
          p.write_text(text)
          PY
          gofmt -w internal/agent/coordinator.go internal/agent/toolregistry.go internal/agent/prompt/*.go
      - name: Validate prompt runtime
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout 5m ./internal/agent/prompt
          go test -count=1 -timeout 5m ./internal/agent -run 'Test.*(Registry|Prompt|Tools)'
          go build ./...
      - name: Publish implementation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/complete-runtime.yml
          git add internal/agent
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: support live system prompt overrides and deterministic context resolution'
          git push origin HEAD:refs/heads/production/pi-runtime-completion
      - name: Capture validation diff
        if: failure()
        shell: bash
        run: |
          git add -N internal/agent
          git diff > runtime-validation.patch
          git status --short > runtime-validation-status.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-validation-failure
          path: |
            runtime-validation.patch
            runtime-validation-status.txt
          retention-days: 7
